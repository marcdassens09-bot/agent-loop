name: Recette mpsolutionsia

# Ce depot deploie le service Render "mpsolutionsia" (mpsolutionsia_app.py).
# Objectif : detecter en quelques minutes une regression qui casserait le
# bot en prod (cle API invalide, reponse de repli, perte de la phrase
# d'identification IA Act) au lieu de la decouvrir via un client.
#
# mpsolutionsia mis en pause sur Render le 31/10/2026 (aucun site ne
# l'appelle) : declenchement automatique coupe. Pour le reprendre : relancer
# le service sur Render (Resume), remettre sa suite dans SUITES
# d'agent_recette.py, puis remettre ci-dessous "push: branches: [main]".
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  recette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Recette du bot mpsolutionsia en prod
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python agent_recette.py mpsolutionsia
